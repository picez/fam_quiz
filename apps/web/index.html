<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060505" />
    <meta name="description" content="Живі вікторини: ведучий запускає гру, гравці відповідають із телефонів." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Вікторина</title>
    <!-- Тема (quiz:theme) — ще до першого малювання, щоб світла тема не блимала темною; логіка та сама, що в theme-mode.ts. -->
    <script>
      try {
        var theme = localStorage.getItem('quiz:theme');
        if (theme === 'light' || (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('is-light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f2f1');
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Опис розгортання на Render: один вебсервіс (API, WebSocket і зібраний клієнт) та база.
# Як користуватися: Render Dashboard → New → Blueprint → вибрати цей репозиторій.
services:
  - type: web
    name: fam-quiz
    runtime: node
    region: frankfurt
    # Безкоштовний тариф присипляє сервіс після простою; для гри з людьми потрібен платний.
    plan: free
    # NODE_ENV=production діє й під час збирання, тому інструменти збирання ставимо явно.
    buildCommand: (corepack enable || true) && pnpm install --frozen-lockfile --prod=false && pnpm build
    # Міграції бази виконуються під час запуску сервера.
    # Один процес без обгортки pnpm: сигнал зупинки від Render доходить до сервера напряму.
    startCommand: cd apps/server && node --import tsx src/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fam-quiz-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Сервіс стоїть за проксі Render: без цього всі клієнти ділили б одне обмеження частоти.
      # Число означає кількість проксі перед сервісом; адресам, які клієнт сам вписав у
      # X-Forwarded-For, довіри немає.
      - key: TRUST_PROXY
        value: "1"
      # Необов'язкові змінні додаються пізніше у вкладці Environment сервісу (див. README):
      # BETTER_AUTH_URL (власний домен), GOOGLE_CLIENT_ID і GOOGLE_CLIENT_SECRET (вхід через Google),
      # R2_ACCOUNT_ID, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (зображення в Cloudflare R2;
      # без них зображення лежать на диску сервісу і зникають після кожного розгортання).

databases:
  - name: fam-quiz-db
    databaseName: quiz
    user: quiz
    region: frankfurt
    # УВАГА: безкоштовну базу Render видаляє приблизно через місяць разом з акаунтами,
    # вікторинами та історією. Для справжнього використання виберіть платний тариф.
    plan: free
